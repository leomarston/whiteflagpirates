<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhiteFlagPirates — The Meridian Verge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%91%3C/text%3E%3C/svg%3E" />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #05090e;
    }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #boot {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(120% 100% at 50% 20%, #0d1b28 0%, #05090e 70%);
      color: #d9cfae; font-family: Georgia, 'Times New Roman', serif;
      transition: opacity 1.2s ease; user-select: none;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .flag { font-size: 64px; letter-spacing: 6px; animation: bob 3s ease-in-out infinite; }
    #boot h1 { font-size: 34px; font-weight: normal; letter-spacing: 10px; margin: 18px 0 6px; text-transform: uppercase; }
    #boot p { opacity: 0.6; font-style: italic; letter-spacing: 2px; }
    #boot .boot-bar { flex: none; width: 240px; height: 3px; background: #1d2c39; margin-top: 26px; border-radius: 2px; overflow: hidden; }
    #boot .boot-bar i { display: block; height: 100%; width: 40%; background: #c9a24b; border-radius: 2px; animation: load 1.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg);} 50% { transform: translateY(-8px) rotate(2deg);} }
    @keyframes load { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui"></div>
  <div id="boot">
    <div class="flag">⚑</div>
    <h1>WhiteFlagPirates</h1>
    <p>setting sail for the Meridian Verge…</p>
    <div class="boot-bar"><i></i></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
